# Alembic configuration.
#
# The database URL is intentionally absent. It is read from DATABASE_URL via the
# validated application settings in infra/migrations/env.py, so a connection string
# with a password is never committed and migrations cannot target a different
# database from the application.

[alembic]
script_location = infra/migrations
prepend_sys_path = src
path_separator = os

# Revision filenames are prefixed with a UTC timestamp so history reads in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]
# Generated revisions are formatted and linted like the rest of the project.
hooks = ruff_format, ruff_check
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

# Logging is configured by the application's structlog setup in env.py.
# No [loggers] section here, so Alembic does not install its own handlers.
