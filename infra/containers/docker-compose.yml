# Development-only PostgreSQL.
#
# The credentials below are development-only and are deliberately committed. This
# service binds to 127.0.0.1, so it is not reachable from the network, and it holds
# no real data. Production PostgreSQL is an external managed service (ADR 0002) whose
# credentials live only in the deployment environment.
#
# Run from the repository root:
#   docker compose -f infra/containers/docker-compose.yml up -d

name: student-learning-platform-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: slp-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      # Development-only password. Never reused anywhere else.
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
      # Deterministic collation, so index and sort behavior matches between machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Bound to loopback rather than 0.0.0.0 so the container is not exposed to the
      # local network, which matters on shared or public Wi-Fi.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Waits for the server to accept connections, so 'up -d --wait' and any
      # dependent service do not start against a database that is still initialising.
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
    name: slp-dev-postgres-data
